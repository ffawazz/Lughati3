:root{
  --ink:#1b2a6b; --bg:#fff8e7; --card:#ffffff; --p1:#6c4bff; --p2:#ff5d8f; --p3:#00b894; --p4:#ff9f1c; --p5:#1fa2ff; --red:#e0202b;
  --ok:#14a44d; --bad:#e8590c; --line:#c9d6ff; --shadow:0 6px 0 rgba(27,42,107,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Tajawal','Amiri','Noto Naskh Arabic',sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:1280px;margin:0 auto}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(90deg,var(--p1),var(--p5));color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:0 0 auto}
#top button{border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px;border-radius:16px;min-width:54px;height:54px;font-family:inherit;font-weight:800}
#title{flex:1;text-align:center;font-size:26px;font-weight:800}
#starsBtn{font-size:22px!important;padding:0 14px}
#screen{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
button{font-family:inherit;font-weight:800;color:inherit}
.red{color:var(--red)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,40px);background:#222;color:#fff;padding:14px 22px;border-radius:18px;font-size:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}

/* الرئيسية */
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:16px 20px;box-shadow:var(--shadow);font-family:'Amiri',serif;font-size:28px;line-height:1.7;border:4px solid #ffd166}
.hero-t{flex:1}
.spk{border:0;background:var(--p5);color:#fff;width:52px;height:52px;border-radius:50%;font-size:26px;flex:0 0 auto;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.spk.huge{width:110px;height:110px;font-size:56px}
.where{margin:12px 2px;font-size:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.where .done{color:var(--p3)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{border:0;border-radius:28px;color:#fff;padding:18px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:30px;box-shadow:0 8px 0 rgba(0,0,0,.18);text-align:center;line-height:1.3}
.tile:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tile .em{font-size:56px}
.tile small{font-size:18px;font-weight:600;opacity:.95}
.tile.big{grid-column:1/-1;min-height:190px;font-size:38px}
.tiles.home{grid-template-columns:repeat(3,1fr)}
.tile.big .em{font-size:78px}
.t-write{background:linear-gradient(135deg,#ff5d8f,#ff9f1c)}
.t-read{background:linear-gradient(135deg,#1fa2ff,#6c4bff)}
.t-quick{background:linear-gradient(135deg,#00b894,#1fa2ff)}
.t-map{background:linear-gradient(135deg,#9b5de5,#f15bb5)}
.t-copy{background:linear-gradient(135deg,#6c4bff,#1fa2ff)}.t-dict{background:linear-gradient(135deg,#00b894,#38d9a9)}
.t-letters{background:linear-gradient(135deg,#ff9f1c,#ffc233)}.t-short{background:linear-gradient(135deg,#f15bb5,#9b5de5)}
.t-mixed{background:linear-gradient(135deg,#ff5d8f,#6c4bff)}.t-fill{background:linear-gradient(135deg,#00b894,#1fa2ff)}
.t-order{background:linear-gradient(135deg,#ff9f1c,#ff5d8f)}.t-rules{background:linear-gradient(135deg,#6c4bff,#9b5de5)}
.t-hear{background:linear-gradient(135deg,#1fa2ff,#00b894)}.t-build{background:linear-gradient(135deg,#ff5d8f,#ff9f1c)}
.t-odd{background:linear-gradient(135deg,#9b5de5,#ff5d8f)}
.tiles.menu{margin-top:12px}
.parent-link{display:block;margin:16px auto 0;border:0;background:#fff;border-radius:18px;padding:12px 22px;font-size:20px;box-shadow:var(--shadow)}
.sub{margin:6px 4px;font-size:20px;opacity:.8}
.note{font-size:18px;opacity:.75;line-height:1.7;margin:10px 4px}

/* اختيار النطاق */
.scope{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{background:#ffe9a8;border-radius:16px;padding:8px 14px;font-size:20px;font-family:'Amiri',serif}
.seg{border:3px solid var(--p1);background:#fff;color:var(--p1);border-radius:16px;padding:10px 16px;font-size:20px}
.seg.on{background:var(--p1);color:#fff}
.concepts{margin:10px 0}
.cchip{border:0;background:#e9e4ff;border-radius:16px;padding:10px 14px;margin:4px;font-size:19px;font-family:'Amiri',serif;font-weight:700}

/* الدروس */
.unit h3{margin:14px 4px 8px;font-size:24px}
.lrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lcard{position:relative;border:4px solid transparent;border-radius:22px;background:#fff;box-shadow:var(--shadow);padding:14px 16px;text-align:right;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.lcard.focus{border-color:var(--p4);background:#fff4d6}
.lcard.lock{opacity:.5;filter:grayscale(.6)}
.lnum{grid-row:1/3;background:var(--p1);color:#fff;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:28px}
.ltitle{font-family:'Amiri',serif;font-size:26px;line-height:1.5}
.lbadges span{opacity:.25;font-size:22px;margin-inline-end:4px}.lbadges span.ok{opacity:1}
.lmark{grid-row:1/3;grid-column:3;font-size:30px}
.check{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px}
.lstars{font-size:18px;grid-column:2}

/* الجولة */
.dots{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px}
.dots i{width:22px;height:22px;border-radius:50%;background:#dcd6f7;display:inline-block}
.dots i.c{background:var(--p4);transform:scale(1.25)}.dots i.d{background:var(--p3)}
.sc{margin-inline-start:14px;font-size:24px}
.qcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:18px 20px;box-shadow:var(--shadow);border:4px solid #c8d4ff;cursor:pointer}
.qtext{flex:1;font-family:'Amiri',serif;font-size:34px;line-height:1.8}
.qtext.qbig{font-size:38px}
.qsub{font-size:34px;margin-top:6px;background:#f3f0ff;border-radius:16px;padding:6px 12px}
.clue{display:block;font-size:22px;color:var(--p3);font-family:'Tajawal'}
.ear{font-size:44px;margin-inline-end:8px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.choice{border:0;border-radius:24px;min-height:110px;font-family:'Amiri',serif;font-size:32px;line-height:1.5;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2);padding:10px}
.choice.c0{background:#6c4bff}.choice.c1{background:#ff5d8f}.choice.c2{background:#1fa2ff}
.gate .choice{background:#6c4bff}
.choice.right{background:var(--ok)!important;animation:pop .5s}
.choice.wrong{background:#999!important;text-decoration:line-through}
.choice:disabled{opacity:.9}
.fb{margin-top:14px;min-height:20px}
.fb .msg{font-size:28px;margin:8px 0;font-family:'Amiri',serif}
.fb.good{background:#dff7e6;border-radius:22px;padding:8px 16px;border:3px solid var(--ok)}
.fb.bad{background:#fff0e0;border-radius:22px;padding:8px 16px;border:3px solid var(--bad)}
.write .fb.good,.write .fb.bad{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.write .fb .msg{font-size:24px;margin:2px 0;flex:1 1 320px}.write .fb .row{margin:2px 0}.write .fb .btn{min-height:52px;font-size:22px;padding:8px 18px}
.write .fb .btn.ghost{background:#fff}
.fb.pop .msg{animation:pop .5s}
.dock{position:sticky;bottom:0;background:linear-gradient(rgba(255,248,231,0),var(--bg) 12px);padding-top:12px;z-index:3}
.hintx{font-family:'Amiri',serif;font-size:26px;background:#fff;border-radius:16px;padding:8px 14px;margin:8px 0}
.btn{border:0;border-radius:20px;background:var(--p1);color:#fff;font-size:24px;padding:14px 22px;min-height:62px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn.ghost{background:#fff;color:var(--p1);border:3px solid var(--p1);box-shadow:none}
.btn.good{background:var(--ok)}.btn.danger{background:#d00000}
.btn.big{min-width:190px;font-size:28px;background:var(--ok)}
.btn.next{background:var(--p4);font-size:26px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tray,.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;min-height:78px;padding:10px;border-radius:20px}
.tray{background:#fff;border:4px dashed #c8d4ff}
.chip-l,.chip-w{border:0;border-radius:18px;background:var(--p2);color:#fff;font-family:'Amiri',serif;font-size:42px;min-width:70px;min-height:70px;padding:0 14px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.chip-w{font-size:30px;background:var(--p5)}
.chip-l.placed,.chip-w.placed{background:var(--p3)}
.bank button:disabled{opacity:.25}
.shake{animation:shake .45s}
.results{text-align:center;padding-top:10px}
.bigstars span{font-size:64px;display:inline-block;filter:grayscale(1) opacity(.3)}
.bigstars span.on{filter:none;animation:pop .6s both}
.rmsg{font-family:'Amiri',serif;font-size:36px;margin:14px 0;line-height:1.7}
.rsub{font-size:24px}
.doneBadge{margin:16px auto;display:inline-flex;align-items:center;gap:10px;background:#dff7e6;border-radius:22px;padding:10px 20px;font-size:24px;font-family:'Amiri',serif}

/* القراءة */
.along .lt{font-family:'Amiri',serif;font-size:30px;text-align:center;margin-bottom:8px;color:var(--p1)}
.ptext{font-family:'Amiri',serif;font-size:40px;line-height:2.4;background:#fff;border-radius:26px;padding:18px 22px;box-shadow:var(--shadow);border:4px solid #c8d4ff}
.ptext .w{cursor:pointer;border-radius:12px;padding:2px 4px;display:inline-block;transition:.15s}
.ptext .w.hl{background:#ffe066;transform:scale(1.12);box-shadow:0 0 0 4px #ffe066}
.ptext .pn{opacity:.7}

/* الكتابة */
.write .wtitle{font-size:19px;text-align:center;margin:0 0 6px}
.model{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:10px 18px;box-shadow:var(--shadow);border:4px solid #c8d4ff;margin-bottom:10px}

.model .mtext.q{font-size:32px}.model .mtext.hid{font-size:22px;font-family:Tajawal;opacity:.6}
.model.slim .mtext{font-size:34px;line-height:1.6}
.model.dict{justify-content:center}.model.slim{padding:6px 14px}
.ans{background:#dff7e6;border:4px solid var(--ok);border-radius:22px;padding:10px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ans[hidden]{display:none}

.padwrap{display:flex;gap:10px;align-items:stretch}
.pad{position:relative;flex:1;height:clamp(200px,42vh,400px);background:#fff;border-radius:24px;border:5px solid var(--p1);box-shadow:var(--shadow);overflow:hidden;touch-action:none}
.pad.m-trace{height:clamp(220px,44vh,420px)}
.pad canvas{position:absolute;inset:0;touch-action:none}
.pad[data-tool=eraser]{border-color:var(--p2)}
.tools{display:flex;flex-direction:column;gap:8px}
.tl{border:0;background:#fff;border-radius:18px;width:78px;flex:1;font-size:30px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent}
.tl small{font-size:14px}.tl.on{border-color:var(--p1);background:#ece8ff}
.wbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:8px;padding-bottom:4px}
.hold{position:relative;overflow:hidden;border:3px solid var(--ok);background:#fff;border-radius:20px;min-height:62px;padding:6px 18px;font-size:20px;color:var(--ok);touch-action:none}
.hold .fill{position:absolute;inset:0 0 0 auto;width:0;background:rgba(20,164,77,.3)}
.hold .lab{position:relative;display:flex;flex-direction:column;line-height:1.3}.hold small{font-size:13px;opacity:.8}
.hold.holding{transform:scale(.98)}

.gate{text-align:center;padding:20px}.gq{font-size:60px;margin:20px}
.parent section{background:#fff;border-radius:22px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.parent h3{margin:0 0 8px;font-size:24px}
.plist{display:flex;flex-direction:column;gap:6px}
.pu{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pl{border:3px solid var(--p1);background:#fff;color:var(--p1);border-radius:14px;padding:10px 14px;font-size:19px;font-family:'Amiri',serif}
.pl.on{background:var(--p1);color:#fff}
.sw,.rg{display:block;margin:10px 0;font-size:20px}
.sw input{width:26px;height:26px;vertical-align:middle;margin-inline-end:8px}
.who{margin:8px 0;font-size:20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

@media (max-width:700px){
  .tiles.home{grid-template-columns:repeat(2,1fr)}
  .tiles.home .t-map{grid-column:1/-1}
  .choices{grid-template-columns:1fr}
  .choice{min-height:84px;font-size:28px}

  .qtext{font-size:28px}.ptext{font-size:32px}.model .mtext{font-size:30px}
  .padwrap{flex-direction:column}.pad{flex:none;width:100%}.tools{flex-direction:row}.tl{width:auto;height:64px;flex:1}
  #title{font-size:20px}
}
@media (orientation:landscape) and (max-height:620px){
  #screen{padding:8px}
  .pad{height:clamp(150px,40vh,300px)}
  .hero{font-size:22px;padding:10px 16px}
  .tile{min-height:110px}.tile.big{min-height:120px}
}

<script>

'use strict';

/* ---------- أدوات عامة ---------- */

/* ---------- حفظ التقدّم محلياً ---------- */

/* ---------- النطق: جسر أندرويد ثم المتصفح ---------- */
const TTS = {
  seq: 0, waits: {}, voice: null,
  get native() { return typeof window.AndroidTTS !== 'undefined' && window.AndroidTTS && typeof window.AndroidTTS.speak === 'function'; },
  status() {
    if (this.native) { try { return JSON.parse(window.AndroidTTS.status()); } catch (e) { return { engine: 'android', ready: false, arabic: false }; } }

  stop() {

  // يعيد وعداً يُحلّ عند انتهاء الكلام (أو بعد مهلة تقديرية حتى لا يتوقف البرنامج)
  speak(text, o = {}) {
    const S = Store.data.set; if (!S.sound && !o.force) return Promise.resolve(false);

/* =====================================================================
   لوحة الكتابة بالقلم
   - ضغط القلم يغيّر سماكة الخط
   - بعد استخدام القلم تُتجاهل لمسات اليد (رفض راحة اليد)
   - طرف الممحاة في القلم يمحو
   ===================================================================== */
class InkCanvas {
  constructor(wrap, opt = {}) {
    this.wrap = wrap; this.opt = opt;
    this.under = document.createElement('canvas'); this.under.className = 'cv-under';
    this.ink = document.createElement('canvas'); this.ink.className = 'cv-ink';
    wrap.appendChild(this.under); wrap.appendChild(this.ink);
    this.strokes = []; this.history = []; this.tool = 'pen'; this.active = null; this.guide = null;
    this.color = '#1b2a6b'; this.onchange = opt.onchange || (() => {});
    this.stats = { pen: 0, touch: 0, mouse: 0, ignoredTouch: 0, erased: 0 };
    this._bind(); this.resize();
    if (typeof ResizeObserver !== 'undefined') { this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(wrap); }
  }
  destroy() { if (this.ro) this.ro.disconnect(); }
  static widthFor(p) { return 1.6 + Math.max(0, Math.min(1, p)) * 8; }
  resize() {
    const r = this.wrap.getBoundingClientRect(); const dpr = Math.max(1, window.devicePixelRatio || 1);
    this.w = Math.max(50, Math.round(r.width)); this.h = Math.max(50, Math.round(r.height)); this.dpr = dpr;
    [this.under, this.ink].forEach(c => { c.width = this.w * dpr; c.height = this.h * dpr; c.style.width = this.w + 'px'; c.style.height = this.h + 'px'; });
    this.redrawUnder(); this.redraw();
  }
  setGuide(fn) { this.guide = fn; this.redrawUnder(); }
  redrawUnder() {
    const c = this.under.getContext('2d'); c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.w, this.h);
    // سطور الكتابة
    c.strokeStyle = '#c9d6ff'; c.lineWidth = 2; c.setLineDash([]);
    const n = this.opt.lines || 3;
    for (let i = 1; i <= n; i++) { const y = (this.h * i) / (n + 1); c.beginPath(); c.moveTo(14, y); c.lineTo(this.w - 14, y); c.stroke(); }
    if (this.guide) this.guide(c, this.w, this.h);
  }
  _bind() {
    const cv = this.ink;
    cv.style.touchAction = 'none';
    ['contextmenu', 'selectstart', 'dragstart'].forEach(ev => cv.addEventListener(ev, e => e.preventDefault()));
    cv.addEventListener('pointerdown', e => this._down(e));
    cv.addEventListener('pointermove', e => this._move(e));
    cv.addEventListener('pointerup', e => this._up(e));
    cv.addEventListener('pointercancel', e => this._up(e));
  }
  _pos(e) { const r = this.ink.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  _pressure(e) { let p = e.pressure; if (!(p > 0)) p = 0.5; if (e.pointerType === 'mouse') p = 0.5; return p; }
  _isEraser(e) { return this.tool === 'eraser' || (e.pointerType === 'pen' && ((e.buttons & 32) === 32 || e.button === 5)); }
  _down(e) {
    const S = Store.data.set;
    if (e.pointerType === 'pen') { this.stats.pen++; if (!S.penSeen) { S.penSeen = true; Store.save(); } }
    else if (e.pointerType === 'touch') {
      // رفض راحة اليد: بعد استخدام القلم لا نقبل اللمس ما لم يسمح الوالدان بالإصبع
      if (S.penSeen && !S.finger) { this.stats.ignoredTouch++; return; }
      this.stats.touch++;
    } else this.stats.mouse++;
    if (this.active) return; // مؤشر واحد فقط (يتجاهل راحة اليد أثناء الكتابة)
    e.preventDefault();
    try { this.ink.setPointerCapture(e.pointerId); } catch (er) { /* لا شيء */ }
    const [x, y] = this._pos(e);
    const eraser = this._isEraser(e);
    this.active = { id: e.pointerId, eraser, type: e.pointerType, erased: [], stroke: null };
    if (eraser) { this._erase(x, y); this.wrap.classList.add('erasing'); }
    else { const st = { pts: [[x, y, this._pressure(e)]], color: this.color }; this.active.stroke = st; this.strokes.push(st); this._dot(st); }
  }
  _move(e) {
    const a = this.active; if (!a || a.id !== e.pointerId) return;
    e.preventDefault();
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for (const ev of evs) {
      const [x, y] = this._pos(ev);
      // الممحاة قد تُضغط في منتصف الحركة
      if (a.eraser) this._erase(x, y);
      else {
        const pts = a.stroke.pts; const last = pts[pts.length - 1];
        if (Math.hypot(x - last[0], y - last[1]) < 0.8) continue;
        pts.push([x, y, this._pressure(ev)]); this._seg(a.stroke, pts.length - 1);
      }
    }
  }
  _up(e) {
    const a = this.active; if (!a || a.id !== e.pointerId) return;
    this.active = null; this.wrap.classList.remove('erasing');
    if (a.eraser) { if (a.erased.length) this.history.push({ t: 'erase', s: a.erased }); }
    else { this.history.push({ t: 'add', s: a.stroke }); }
    this.onchange(this);
  }
  _erase(x, y) {
    const R = 18; const a = this.active;
    for (let i = this.strokes.length - 1; i >= 0; i--) {
      const st = this.strokes[i];
      if (st.pts.some(p => Math.hypot(p[0] - x, p[1] - y) <= R)) { this.strokes.splice(i, 1); a.erased.push({ st, i }); this.stats.erased++; }
    }
    if (a.erased.length) this.redraw();
  }
  _ctx() { const c = this.ink.getContext('2d'); c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.lineCap = 'round'; c.lineJoin = 'round'; return c; }
  _dot(st) { const c = this._ctx(); const p = st.pts[0]; c.fillStyle = st.color; c.beginPath(); c.arc(p[0], p[1], InkCanvas.widthFor(p[2]) / 2, 0, 7); c.fill(); }
  _seg(st, i) { const c = this._ctx(); const a = st.pts[i - 1], b = st.pts[i]; c.strokeStyle = st.color; c.lineWidth = InkCanvas.widthFor((a[2] + b[2]) / 2); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
  redraw() {
    const c = this.ink.getContext('2d'); c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.w, this.h);
    for (const st of this.strokes) { if (st.pts.length === 1) this._dot(st); else for (let i = 1; i < st.pts.length; i++) this._seg(st, i); }
  }
  undo() {
    const h = this.history.pop(); if (!h) return;
    if (h.t === 'add') { const i = this.strokes.indexOf(h.s); if (i >= 0) this.strokes.splice(i, 1); }
    else { h.s.slice().sort((a, b) => a.i - b.i).forEach(o => this.strokes.splice(Math.min(o.i, this.strokes.length), 0, o.st)); }
    this.redraw(); this.onchange(this);
  }
  clear() { this.strokes = []; this.history = []; this.redraw(); this.onchange(this); }
  setTool(t) { this.tool = t; this.wrap.dataset.tool = t; }
  hasInk() { return this.strokes.length > 0; }
}

/* =====================================================================
   فاحص الخط المتسامح
   الفكرة: نحوّل ما كتبه الطفل وشكل الكلمة المطلوبة إلى شبكة صغيرة بعد تطبيعهما
   (الموضع والحجم لا يهمّان)، ثم نقيس:

const PUNCT = /^[،.؟!:؛]+$/;

   عناصر الكتابة
   ===================================================================== */
function genWrite(mode, n = 5) {
  const ls = scopeLessons(); const out = []; const clauses = ls.flatMap(l => l.copy || []);
  const words = uniq(ls.flatMap(l => (l.dict || []).concat((l.vocab || []).map(v => v.w))));
  const single = words.filter(w => !/\s/.test(w));
  const mk = {
    trace: () => shuffle(single).slice(0, Math.max(0, n - 1)).map(t => ({ mode: 'trace', text: t })).concat(shuffle(clauses).slice(0, 1).map(t => ({ mode: 'trace', text: t }))),
    copy: () => shuffle(clauses).slice(0, n).map(t => ({ mode: 'copy', text: t })),
    dict: () => shuffle(single).slice(0, n).map(t => ({ mode: 'dict', text: t })),
    letters: () => shuffle(single.filter(w => strip(w).length >= 4)).slice(0, n).map(w => {
      const L = Array.from(w); const bases = []; L.forEach((ch, i) => { if (/[ء-ي]/.test(ch) && i > 0) bases.push(i); });
      const k = bases.length > 5 ? 2 : 1; const gaps = shuffle(bases).slice(0, k).sort((a, b) => a - b); const shown = L.map((ch, i) => (gaps.includes(i) ? '◌' : ch)).join('');
      return { mode: 'letters', text: w, shown, missing: gaps.map(i => L[i]).join(' ، ') };
    }),
    short: () => shuffle(ls.flatMap(l => l.short || [])).slice(0, Math.min(n, 3)).map(s => ({ mode: 'short', text: s.a, q: s.q, free: !!s.free })),
  };
  if (mode === 'mixed') { ['trace', 'copy', 'dict', 'letters', 'short'].forEach(m => out.push(...mk[m]().slice(0, 1))); return out; }
  return mk[mode]().slice(0, n);
}

SCREENS.round = p => {
  setTitle(p.title); const R = App.round = { items: p.items, i: 0, stars: 0, section: p.section, title: p.title, tries: 0, lock: false };
  const draw = () => {
    const q = R.items[R.i]; R.tries = 0; R.lock = false;
    const dots = R.items.map((_, k) => `<i class="${k < R.i ? 'd' : k === R.i ? 'c' : ''}"></i>`).join('');
    let body = '';
    const qcard = `<div class="qcard" id="qcard" role="button" tabindex="0" aria-label="اضغط لتسمع السؤال">${speakBtn(q.speak)}<div class="qtext ${q.big ? 'qbig' : ''}">${q.speakOnly ? '<span class="ear">👂</span>' : ''}${redify(q.prompt)}${q.sub ? `<div class="qsub">${q.clue ? `<span class="clue">الْجَوَابُ : ${esc(q.clue)}</span>` : ''}${redify(q.sub)}</div>` : ''}</div></div>`;
    if (q.kind === 'mc') body = `<div class="choices">${q.choices.map((c, k) => `<button class="choice c${k}" data-k="${k}">${esc(c)}</button>`).join('')}</div>`;
    else if (q.kind === 'build') body = `<div class="tray" id="tray"></div><div class="bank" id="bank">${q.letters.map((l, k) => `<button class="chip-l" data-k="${k}">${l}</button>`).join('')}</div><div class="row"><button class="btn ghost" id="undoL">↩️ تَرَاجَعْ</button></div>`;
    else body = `<div class="tray words" id="tray"></div><div class="bank words" id="bank">${q.words.map((l, k) => `<button class="chip-w" data-k="${k}">${esc(l)}</button>`).join('')}</div><div class="row"><button class="btn ghost" id="undoL">↩️ تَرَاجَعْ</button></div>`;
    el().innerHTML = `<div class="round"><div class="dots">${dots}<span class="sc">⭐ ${AR_DIGITS(R.stars)}</span></div>${qcard}${body}<div class="dock"><div class="fb" id="fb"></div></div></div>`;
    bindSay(el()); const qc = $('#qcard'); qc.addEventListener('click', () => TTS.speak(q.speak));
    if (q.kind === 'mc') $$('.choice', el()).forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
    else buildHandlers(q);
    TTS.speak(q.speak);
  };
  const feedback = (ok, q, last) => {
    const fb = $('#fb'); const msg = ok ? Praise.okMsg() : Praise.tryMsg();
    fb.className = 'fb ' + (ok ? 'good' : 'bad');
    fb.innerHTML = `<div class="msg">${ok ? '🌟 ' : '💪 '}${esc(msg)}</div>${last && q.hint ? `<div class="hintx">${redify(q.hint)}</div>` : ''}${last ? `<button class="btn next" id="next">${R.i + 1 >= R.items.length ? 'النَّتِيجَةُ 🏁' : 'التَّالِي ◀'}</button>` : ''}`;
    if (last) $('#next').addEventListener('click', () => { R.i++; if (R.i >= R.items.length) finish(); else draw(); });
    if (ok) { fb.classList.add('pop'); }
    TTS.speak(msg.replace(/[!؟]/g, ''), { keep: false });
  };
  const answer = k => {
    if (R.lock) return; const q = R.items[R.i]; const btn = $$('.choice', el())[k];
    if (k === q.ans) { R.lock = true; btn.classList.add('right'); const first = R.tries === 0; if (first) { R.stars++; $('.sc').textContent = '⭐ ' + AR_DIGITS(R.stars); } $$('.choice', el()).forEach(b => b.disabled = true); feedback(true, q, true); }
    else { R.tries++; btn.classList.add('wrong'); btn.disabled = true; if (R.tries >= 2) { R.lock = true; $$('.choice', el())[q.ans].classList.add('right'); $$('.choice', el()).forEach(b => b.disabled = true); feedback(false, q, true); } else feedback(false, q, false); }
  };
  const buildHandlers = q => {
    const tray = $('#tray'), bank = $('#bank'); const need = q.kind === 'build' ? q.target.length : q.target.length; const got = [];
    const val = () => got.map(g => (q.kind === 'build' ? q.letters[g] : q.words[g]));
    const show = () => { tray.innerHTML = got.map(g => `<span class="${q.kind === 'build' ? 'chip-l placed' : 'chip-w placed'}">${esc(q.kind === 'build' ? q.letters[g] : q.words[g])}</span>`).join(''); $$('#bank button', el()).forEach(b => b.disabled = got.includes(+b.dataset.k)); };
    $$('#bank button', el()).forEach(b => b.addEventListener('click', () => {
      if (R.lock) return; got.push(+b.dataset.k); show(); TTS.speak(q.kind === 'build' ? q.letters[+b.dataset.k] : q.words[+b.dataset.k], { force: false });
      if (got.length === need) {
        const ok = val().join(q.kind === 'build' ? '' : ' ') === q.target.join(q.kind === 'build' ? '' : ' ');
        if (ok) { R.lock = true; const first = R.tries === 0; if (first) { R.stars++; $('.sc').textContent = '⭐ ' + AR_DIGITS(R.stars); } $('#bank').classList.add('done'); feedback(true, Object.assign({}, q, { hint: q.show || q.hint }), true); }
        else { R.tries++; tray.classList.add('shake'); setTimeout(() => tray.classList.remove('shake'), 500); if (R.tries >= 2) { R.lock = true; feedback(false, q, true); } else { feedback(false, q, false); setTimeout(() => { got.length = 0; show(); }, 700); } }
      }
    }));
    $('#undoL').addEventListener('click', () => { if (R.lock) return; got.pop(); show(); });
  };
  const finish = () => replace('results', { stars: R.stars, total: R.items.length, section: R.section, title: R.title });
  draw();
};

    ${f.noText ? '<p class="note">هَذِهِ جُمْلَةٌ وَاحِدَةٌ مِنْ أَوْرَاقِ الْعَمَلِ ، فَلَيْسَ لِهَذَا الدَّرْسِ مَقْطَعٌ قِرَائِيٌّ فِيهَا .</p>' : ''}

    <div class="row"><button class="btn" id="play">▶ اِقْرَأْ مَعِي</button><button class="btn ghost" id="stop">⏹ أَوْقِفْ</button><button class="btn ghost" id="slow">🐢 بَطِيءٌ</button></div></div>`;
  const words = $$('.w', el()); let slow = true;

    words.forEach(x => x.classList.remove('hl'));

      <div class="dock"><div class="fb" id="fb"></div>

    const cv = App.cv = new InkCanvas($('#pad'), { lines, onchange: () => {} });

      W.misses++; fb.className = 'fb bad'; // الحبر يبقى كما هو
      fb.innerHTML = `<div class="msg">💪 ${esc(WRITE_MSG[r.reason] || WRITE_MSG.miss)}</div><div class="row"><button class="btn ghost" id="keep">✏️ أُكْمِلُ</button><button class="btn ghost" id="redo">🗑️ أُعِيدُ مِنَ الْبِدَايَةِ</button></div>`;
      $('#keep').addEventListener('click', () => { fb.innerHTML = ''; fb.className = 'fb'; }); $('#redo').addEventListener('click', () => { cv.clear(); fb.innerHTML = ''; fb.className = 'fb'; });
      TTS.speak(Praise.tryMsg().replace(/[!؟]/g, '')); return;
    }
    // إملاء / حروف ناقصة / إجابة قصيرة : نعرض الشكل الصحيح ثم يؤكّد الطالب أو الوالد
    if (!cv.hasInk()) { fb.className = 'fb bad'; fb.innerHTML = `<div class="msg">💪 ${esc(WRITE_MSG.blank)}</div>`; return; }
    if (W.revealed) return; W.revealed = true; const a = $('#ans'); a.hidden = false;
    const correct = it.mode === 'letters' ? `${it.text}<small>الْحُرُوفُ النَّاقِصَةُ : ${esc(it.missing)}</small>` : it.mode === 'short' ? `${esc(it.text)}` : esc(it.text);
    a.innerHTML = `<div class="al">${it.mode === 'short' ? 'الْإِجَابَةُ النَّمُوذَجِيَّةُ' : 'هَكَذَا تُكْتَبُ'} :</div><div class="at">${correct}</div>${speakBtn(it.mode === 'short' ? it.text : it.text)}`; bindSay(a);
    fb.className = 'fb'; fb.innerHTML = `<div class="msg">قَارِنْ كِتَابَتَكَ بِالْأَصْلِ ، هَلْ كَتَبْتَهَا صَحِيحَةً ؟</div><div class="row"><button class="btn good" id="yes">✅ نَعَمْ ، كَتَبْتُهَا صَحِيحَةً</button><button class="btn ghost" id="no">🔁 سَأُعِيدُ الْمُحَاوَلَةَ</button></div>`;
    $('#yes').addEventListener('click', () => { a.hidden = true; pass(it, false); }); $('#no').addEventListener('click', () => { cv.clear(); a.hidden = true; W.revealed = false; fb.innerHTML = ''; fb.className = 'fb'; });
    TTS.speak(it.text);
  };
  draw();
};
// زر الضغط المطوّل (لتأكيد الوالدين)
function holdButton(btn, ms, cb) {
  let t = null, raf = 0, t0 = 0; const fill = $('.fill', btn);
  const stop = () => { clearTimeout(t); cancelAnimationFrame(raf); fill.style.width = '0%'; btn.classList.remove('holding'); };
  const start = e => { e.preventDefault(); btn.classList.add('holding'); t0 = performance.now(); const tick = () => { fill.style.width = Math.min(100, (performance.now() - t0) / ms * 100) + '%'; raf = requestAnimationFrame(tick); }; tick(); t = setTimeout(() => { stop(); cb(); }, ms); };
  btn.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter') cb(); });
}

  el().innerHTML = `<div class="gate"><p>هَذِهِ الصَّفْحَةُ لِلْكِبَارِ فَقَطْ . حُلَّ الْمَسْأَلَةَ لِلدُّخُولِ :</p><div class="gq">${AR_DIGITS(a)} + ${AR_DIGITS(b)} = ؟</div>
  <div class="choices">${ch.map(c => `<button class="choice" data-v="${c}">${AR_DIGITS(c)}</button>`).join('')}</div></div>`;
  $$('.choice', el()).forEach(x => x.addEventListener('click', () => { if (+x.dataset.v === ans) replace('parent'); else { x.classList.add('wrong'); x.disabled = true; } }));
};

      <p class="note" id="ttsst">${st.arabic ? 'الصَّوْتُ الْعَرَبِيُّ مُتَوَفِّرٌ ✅' : 'لَمْ يُعْثَرْ عَلَى صَوْتٍ عَرَبِيٍّ فِي الْجِهَازِ ⚠️ . ثَبِّتْ «Speech Services by Google» وَحَمِّلِ اللُّغَةَ الْعَرَبِيَّةَ مِنْ إِعْدَادَاتِ النُّطْقِ .'} ( مُحَرِّكُ النُّطْقِ : ${esc(st.engine || '')} )</p></section>
    <section><h3>عَنِ الْمُحْتَوَى</h3><p class="note">التَّطْبِيقُ مَبْنِيٌّ عَلَى فِهْرِسِ كِتَابِ لُغَتِي ( الصَّفِّ الثَّالِثِ ، الْفَصْلِ الْأَوَّلِ ) وَأَوْرَاقِ الْعَمَلِ الْمَنْشُورَةِ فِي مَوْقِعِ كُتُبِي . نُصُوصُ الْقِرَاءَةِ هِيَ الْمَقَاطِعُ الْوَارِدَةُ فِي أَوْرَاقِ الْعَمَلِ ، وَلَيْسَتْ نَصَّ الدَّرْسِ كَامِلًا . يُرْجَى مُرَاجَعَةُ التَّشْكِيلِ وَالْإِجَابَاتِ مَعَ الْكِتَابِ الْمَدْرَسِيِّ .</p></section>
