name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Playwright tests (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run tests
        run: NODE_PATH=$PWD/node_modules node tests/run.js

  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK (platform 34, build-tools 34.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (index.html is copied into assets by Gradle)
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the APK contains the app
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | cmp - index.html
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "sdkVersion|package:"
      - uses: actions/upload-artifact@v4
        with:
          name: lughati3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
